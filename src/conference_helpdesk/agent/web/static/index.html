<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conference Helpdesk</title>
<style>
  :root { --bg:#0f1221; --panel:#171a2e; --accent:#5b8cff; --user:#2b3566; --bot:#20243d; --text:#e7e9f5; --muted:#9aa0c4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:16px 20px; background:var(--panel); border-bottom:1px solid #262a47; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:12px 14px; border-radius:12px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; max-width:85%; }
  .user { background:var(--user); align-self:flex-end; border-bottom-right-radius:4px; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .bot.err { background:#3a1f26; color:#ffb4b4; }
  .meta { font-size:11px; color:var(--muted); margin:2px 4px; }
  .typing { color:var(--muted); font-style:italic; }
  form { display:flex; gap:10px; padding:16px 20px; background:var(--panel); border-top:1px solid #262a47; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2d3256; background:#10132a; color:var(--text); font-size:15px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:12px 20px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header>
    <h1>Conference Helpdesk</h1>
    <p>Ask about sessions, schedules, speakers, rooms and the venue — powered by Elastic Agent Builder.</p>
  </header>
  <div id="chat">
    <div class="bot msg">Hi! I'm the conference helpdesk. Ask me anything about the program — sessions, speakers, rooms, tracks, or the venue.</div>
  </div>
  <form id="form">
    <input id="input" placeholder="e.g. What Kubernetes sessions are on day 1?" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let conversationId = null;

  function add(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, 'user');
    input.value = '';
    send.disabled = true;
    const typing = add('Thinking…', 'bot typing');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, conversation_id: conversationId })
      });
      const data = await res.json();
      typing.remove();
      if (data.error) {
        add(data.error, 'bot err');
      } else {
        conversationId = data.conversation_id || conversationId;
        add(data.reply || '(no response)', 'bot');
      }
    } catch (err) {
      typing.remove();
      add('Request failed: ' + err, 'bot err');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
